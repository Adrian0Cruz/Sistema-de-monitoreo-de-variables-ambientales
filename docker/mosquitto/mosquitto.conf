# ==============================================================================
# AetherSens - Configuración del Broker MQTT Mosquitto
# ==============================================================================

# Puerto MQTT estándar para ESP32 nativo
listener 1883 0.0.0.0
allow_anonymous true

# Puerto WebSocket para el navegador (Dashboard AetherSens)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Persistencia de mensajes retenidos (configuración de umbrales / estado de nodo)
persistence true
persistence_location /mosquitto/data/

# Registro de logs
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

